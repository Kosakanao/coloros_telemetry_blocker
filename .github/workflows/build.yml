name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hosts 每行必须是 `IP 域名`，注释与空行跳过
      - name: Validate hosts
        run: |
          awk '!/^[[:space:]]*(#|$)/ {
                 if (NF != 2) { printf "system/etc/hosts:%d: 期望 \"IP 域名\"，实际 %d 个字段\n", NR, NF; bad=1 }
               }
               END { exit bad ? 1 : 0 }' system/etc/hosts
          echo "hosts ok: $(grep -c '^0\.0\.0\.0 ' system/etc/hosts) 条"

      - name: Build module zip
        run: |
          ver=$(sed -n 's/^version=v\{0,1\}//p' module.prop)
          out="coloros_telemetry_blocker-v${ver}.zip"
          zip -r -q "$out" module.prop customize.sh system webroot README.md
          ls -l "$out"
          unzip -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: "*.zip"

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
